<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Enterprise Unified Ledger</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <style>
        :root {
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --border: #d1d5db;
            --border-light: #e5e7eb;
            --text-main: #111827;
            --text-muted: #6b7280;
            --primary-dark: #0f172a;
            --credit: #16a34a;
            --debit: #dc2626;
            --radius: 6px;
        }

        body { 
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .fin-math {
            font-variant-numeric: tabular-nums;
            letter-spacing: -0.02em;
        }

        /* --- Enterprise Components --- */
        .ent-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
        }
        
        .ent-header-dark {
            background: var(--primary-dark);
            color: white;
            border: 1px solid var(--primary-dark);
        }

        .ent-label {
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            color: var(--text-muted);
            margin-bottom: 6px;
            display: block;
        }
        
        .ent-label-light { color: #94a3b8; }

        /* --- Form Controls --- */
        .form-control, .form-select {
            background: var(--surface);
            border: 1px solid var(--border);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 0.875rem;
            font-weight: 600;
            color: var(--text-main);
            transition: none; 
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 1px var(--primary-dark);
            outline: none;
        }

        /* --- Buttons --- */
        .ent-btn {
            background-color: var(--primary-dark);
            color: white;
            border: 1px solid var(--primary-dark);
            font-weight: 700;
            font-size: 0.8125rem;
            padding: 10px 16px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            transition: none;
        }
        .ent-btn:hover { background-color: #000; color: white; }
        
        .ent-btn-outline {
            background-color: transparent;
            color: var(--primary-dark);
            border: 1px solid var(--border);
            font-weight: 700;
            font-size: 0.8125rem;
            padding: 10px 16px;
            border-radius: 4px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .ent-btn-outline:hover { background-color: var(--bg-color); border-color: var(--primary-dark); }
        
        .action-btn {
            font-size: 0.75rem;
            font-weight: 700;
            padding: 4px 8px;
            border-radius: 4px;
            border: 1px solid var(--border);
            background: var(--surface);
            color: var(--text-main);
        }
        .action-btn:hover { background: var(--bg-color); }
        .action-btn.danger { color: var(--debit); }
        .action-btn.danger:hover { background: #fef2f2; border-color: var(--debit); }

        /* --- Table Strict --- */
        .ent-table { font-size: 0.8125rem; margin: 0; }
        .ent-table thead th {
            background: var(--bg-color);
            font-size: 0.7rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-muted);
            border-bottom: 2px solid var(--border) !important;
            padding: 10px 16px;
        }
        .ent-table td {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-light);
            vertical-align: middle;
        }
        .ent-table tbody tr:hover { background: #f9fafb; }
        
        .tx-group { font-weight: 700; color: var(--text-main); }
        .tx-party { color: var(--text-muted); font-size: 0.75rem; font-weight: 600; }
        
        .badge-mode {
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 3px 6px; border-radius: 3px; border: 1px solid var(--border);
            white-space: nowrap;
        }

        .empty-state { display: flex; align-items: center; justify-content: center; padding: 40px; color: var(--text-muted); font-size: 0.875rem; font-weight: 600; text-align: center; }

        /* --- Mobile Table Hack --- */
        @media (max-width: 768px) {
            .mobile-hide { display: none !important; }
            .filter-group { flex-direction: column; align-items: stretch !important; width: 100%; }
            .filter-group > * { margin-bottom: 10px; width: 100% !important; }
            
            .ent-table thead { display: none; }
            .ent-table, .ent-table tbody, .ent-table tr, .ent-table td { display: block; width: 100%; }
            .ent-table tr {
                background: var(--surface);
                border: 1px solid var(--border) !important;
                border-radius: var(--radius);
                margin-bottom: 10px;
                padding: 4px 12px;
            }
            .ent-table td {
                display: flex; justify-content: space-between; align-items: center;
                padding: 8px 0; border: none; border-bottom: 1px solid var(--border-light);
                text-align: right;
            }
            .ent-table td:last-child { border-bottom: none; }
            .ent-table td::before {
                content: attr(data-label); font-weight: 700; font-size: 0.7rem; 
                color: var(--text-muted); text-transform: uppercase; text-align: left;
                letter-spacing: 0.05em;
            }
            .tx-group, .tx-party { text-align: right; }
        }

        /* --- Print Styles --- */
        @media print {
            @page { size: A4 portrait; margin: 15mm; }
            body { background-color: #fff !important; margin: 0; padding: 0; color: #000; }
            #sys-sidebar, .status-bar, .no-print, .filter-group { display: none !important; }
            .main-content-wrapper { margin: 0 !important; padding: 0 !important; }
            .ent-card { box-shadow: none !important; border: 1px solid #000 !important; border-radius: 0 !important; margin-bottom: 20px; }
            .mobile-hide { display: table-cell !important; } 
            .badge-mode { border: 1px solid #000 !important; color: #000 !important; background: transparent !important; }
            th, td { font-size: 11px !important; padding: 6px !important; border-color: #000 !important; color: #000 !important; }
        }
    </style>
<base target="_blank">
</head>
<body>

    <script> window.APP_VERSION = 'v1.9.1'; </script>
    <script src="navbar.js"></script>

    <main class="container-fluid py-4 mb-5 d-none" id="admin-content" style="max-width: 1280px;">
        
        <!-- Header Section -->
        <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-end mb-4 pb-3 border-bottom border-secondary-subtle">
            <div>
                <h4 class="fw-bold m-0 text-dark" style="letter-spacing: -0.02em;">Unified Cash Ledger</h4>
                <p class="text-muted small fw-medium mb-0 mt-1">Master transaction history and manual capital adjustments</p>
            </div>
        </div>

        <!-- Master Vault Hero Card -->
        <div class="ent-card ent-header-dark mb-4 p-4 p-md-5">
            <div class="d-flex flex-column flex-md-row justify-content-between align-items-center">
                
                <div class="text-center text-md-start mb-4 mb-md-0 w-100">
                    <div class="ent-label ent-label-light mb-2">Unified Cash Balance</div>
                    <h1 class="fw-bold m-0 fin-math" style="letter-spacing: -0.03em; font-size: 2.5rem;">₹ <span id="vault-balance">0.00</span></h1>
                </div>

                <div class="d-flex flex-column flex-md-row gap-2 w-100 w-md-auto no-print">
                    <button class="ent-btn bg-white text-dark w-100" style="border-color: white;" onclick="openAddFundsModal()">+ Deposit Capital</button>
                    <button class="ent-btn-outline text-white w-100" style="border-color: rgba(255,255,255,0.3);" onclick="openWithdrawModal()">- Withdraw</button>
                </div>

            </div>
        </div>

        <!-- Filter Bar -->
        <div class="ent-card p-3 mb-4 d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-3 no-print">
            <div class="filter-group d-flex align-items-center gap-2 w-100">
                <select id="ledger-source-filter" class="form-select w-auto" style="min-width: 220px;" onchange="applyFilters()">
                    <option value="ALL">All Transactions</option>
                    <option value="RESERVE">Capital Adjustments Only</option>
                    <option value="DAILY">Daily Cash Flows Only</option>
                </select>
                <input type="date" id="filter-date-start" class="form-control w-auto" onchange="applyFilters()">
                <span class="mobile-hide text-muted fw-bold px-2">to</span>
                <input type="date" id="filter-date-end" class="form-control w-auto" onchange="applyFilters()">
            </div>
            <button class="ent-btn-outline px-4" style="white-space: nowrap;" onclick="window.print()">Download PDF</button>
        </div>

        <!-- Data Table -->
        <div class="ent-card overflow-hidden" id="pdf-export-area">
            <div class="p-3 border-bottom bg-white d-flex justify-content-between align-items-center">
                <h6 class="fw-bold m-0 text-uppercase" style="letter-spacing: 0.05em;">Consolidated Ledger</h6>
                <span class="badge-mode bg-light text-muted" id="record-count">Loading...</span>
            </div>
            
            <div class="table-responsive bg-white">
                <table class="table ent-table align-middle mb-0">
                    <thead>
                        <tr>
                            <th class="ps-4">Date</th>
                            <th class="text-center">Type</th>
                            <th class="mobile-hide">Details</th>
                            <th class="text-end">Amount (₹)</th>
                            <th class="text-center pe-4 no-print">Action</th>
                        </tr>
                    </thead>
                    <tbody id="ledger-body">
                        <tr><td colspan="5" class="empty-state">Loading ledger history...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="master-ledger.js"></script>
</body>
</html>
